---
- name: Create backup directory
  become: true
  ansible.builtin.file:
    path: "{{ cluster_data_dir }}/inventree/backups"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: '0755'
  tags:
    - cluster
    - cluster_inventree_backup

- name: Deploy backup script
  ansible.builtin.copy:
    src: inventree/backup.sh
    dest: "{{ cluster_data_dir }}/inventree/backup.sh"
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: '0755'
  tags:
    - cluster
    - cluster_inventree_backup

- name: Run backup script
  ansible.builtin.command:
    cmd: "{{ cluster_data_dir }}/inventree/backup.sh"
  environment:
    BACKUP_DIR: "{{ cluster_data_dir }}/inventree/backups"
    KUBECONFIG: "{{ xdg_config_home}}/kube/config"
  tags:
    - cluster
    - cluster_inventree_backup

- name: Schedule nightly backup
  ansible.builtin.cron:
    name: inventree-backup
    minute: "0"
    hour: "3"
    job: "BACKUP_DIR={{ cluster_data_dir }}/inventree/backups {{ cluster_data_dir }}/inventree/backup.sh"
    user: "{{ home_user }}"
  tags:
    - cluster
    - cluster_inventree_backup
