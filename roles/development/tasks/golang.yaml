---
- name: Map system architecture to Go arch
  ansible.builtin.set_fact:
    go_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
  tags: [dev, dev_go]

- name: Get latest Go version
  ansible.builtin.uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: go_releases
  tags:
    - dev
    - dev_go

- name: Set Go version fact
  ansible.builtin.set_fact:
    go_version: "{{ (go_releases.json | first).version }}"
  tags:
    - dev
    - dev_go

- name: Download Go tarball
  ansible.builtin.get_url:
    url:  "https://golang.org/dl/{{ go_version }}.linux-{{ go_arch }}.tar.gz"
    dest: "/tmp/{{ go_version }}.linux-{{ go_arch }}.tar.gz"
    mode: '0644'
  tags:
    - dev
    - dev_go

- name: Remove old Go toolchain
  become: true
  ansible.builtin.file:
    path: "{{ lab_home }}/toolchains/go/sdk"
    state: absent
  tags:
    - dev
    - dev_go

- name: Create Go sdk directory
  ansible.builtin.file:
    path: "{{ lab_home }}/toolchains/go/sdk"
    state: directory
    mode: '0755'
  tags:
    - dev
    - dev_go

- name: Extract Go toolchain
  ansible.builtin.unarchive:
    src:         "/tmp/{{ go_version }}.linux-{{ go_arch }}.tar.gz"
    dest:        "{{ lab_home }}/toolchains/go/sdk"
    remote_src:  true
    extra_opts:  [--strip-components=1]
    creates:     "{{ lab_home }}/toolchains/go/sdk/bin/go"
  tags:
    - dev
    - dev_go

- name: Install Go dev tools (labs only)
  ansible.builtin.command:
    cmd: "{{ lab_home }}/toolchains/go/sdk/bin/go install {{ item }}"
  loop:
    - golang.org/x/tools/gopls@latest
    - golang.org/x/tools/cmd/goimports@latest
    - mvdan.cc/gofumpt@latest
  environment:
    GOROOT: "{{ lab_home }}/toolchains/go/sdk"
    GOPATH: "{{ lab_home }}/toolchains/go/path"
  when: inventory_hostname in groups['clients']
  register: go_tools_result
  changed_when: go_tools_result.stdout != ""
  tags:
    - dev
    - dev_go
