---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  tags:
    - pkg
    - pkg_unattended

- name: Enable automatic security upgrades
  ansible.builtin.debconf:
    name:     unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    value:    "true"
    vtype:    boolean
  tags:
    - pkg
    - pkg_unattended

- name: Configure unattended-upgrades email notifications
  ansible.builtin.lineinfile:
    path:   /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//Unattended-Upgrade::Mail '
    line:   'Unattended-Upgrade::Mail "{{ user_email }}";'
    state:  "{{ 'present' if unattended_upgrades_email else 'absent' }}"
  when: unattended_upgrades_email | length > 0
  tags:
    - pkg
    - pkg_unattended
