---
- name: Ensure Rust toolchain directory exists
  ansible.builtin.file:
    path: "{{ lab_home }}/toolchains/rust"
    state: directory
    mode: '0755'
  tags:
    - dev
    - dev_rust

- name: Download rustup installer
  ansible.builtin.get_url:
    url:  https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: '0755'
  tags:
    - dev
    - dev_rust

- name: Install rustup
  ansible.builtin.command:
    cmd:     sh /tmp/rustup-init.sh -y
    creates: "{{ lab_home }}/toolchains/rust/.cargo/bin/rustc"
  environment:
    CARGO_HOME:  "{{ lab_home }}/toolchains/rust/.cargo"
    RUSTUP_HOME: "{{ lab_home }}/toolchains/rust/.rustup"
  tags:
    - dev
    - dev_rust

- name: Add rust-src component (labs only)
  ansible.builtin.command:
    cmd: "{{ lab_home }}/toolchains/rust/.cargo/bin/rustup component add rust-src"
  environment:
    CARGO_HOME:  "{{ lab_home }}/toolchains/rust/.cargo"
    RUSTUP_HOME: "{{ lab_home }}/toolchains/rust/.rustup"
  when: inventory_hostname in groups['clients']
  register: rustup_result
  changed_when: "'is up to date' not in rustup_result.stdout"
  tags:
    - dev
    - dev_rust
