---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventree-server
  namespace: inventree
  labels:
    app: inventree-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventree-server
  template:
    metadata:
      labels:
        app: inventree-server
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: inventree
          image: inventree/inventree:stable
          envFrom:
            - secretRef:
                name: inventree-secrets
          env:
            - name: INVENTREE_DB_ENGINE
              value: postgresql
            - name: INVENTREE_DB_HOST
              value: inventree-db
            - name: INVENTREE_DB_PORT
              value: "5432"
            - name: INVENTREE_AUTO_UPDATE
              value: "True"
            - name: INVENTREE_CACHE_HOST
              value: inventree-cache
            - name: INVENTREE_CACHE_PORT
              value: "6379"
            - name: INVENTREE_DEBUG
              value: "False"
            - name: INVENTREE_LOG_LEVEL
              value: WARNING
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /home/inventree/data
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: data
              mountPath: /home/inventree/data
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: data
          hostPath:
            path: /opt/inventree/data
            type: Directory
        - name: nginx-conf
          configMap:
            name: inventree-nginx-conf
