---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventree-cache
  namespace: inventree
  labels:
    app: inventree-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventree-cache
  template:
    metadata:
      labels:
        app: inventree-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: cache-data
              mountPath: /data
      volumes:
        - name: cache-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventree-cache
  namespace: inventree
spec:
  selector:
    app: inventree-cache
  ports:
    - port: 6379
      targetPort: 6379
