---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventree-db
  namespace: inventree
  labels:
    app: inventree-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventree-db
  template:
    metadata:
      labels:
        app: inventree-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: inventree-secrets
                  key: INVENTREE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventree-secrets
                  key: INVENTREE_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: inventree-secrets
                  key: INVENTREE_DB_NAME
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          hostPath:
            path: /opt/inventree/db
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: inventree-db
  namespace: inventree
spec:
  selector:
    app: inventree-db
  ports:
    - port: 5432
      targetPort: 5432
